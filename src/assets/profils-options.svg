<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 224" fill="none" font-family="system-ui,sans-serif" font-size="11">
  <title>Résultat net de deux options achetées, par action</title>
  <desc>Pour un prix d’exercice de 50 euros et une prime de 3 euros, l’achat du call atteint son équilibre à 53 euros et celui du put à 47 euros. La perte maximale est de 3 euros dans les deux cas.</desc>
  <rect width="480" height="224" rx="8" fill="#f3f5fa"/>
  <text x="18" y="23" fill="#334155" font-weight="650">Résultat net par action (€)</text>
  <g stroke="#d3dbe8" stroke-dasharray="3 4"><path d="M52 48H442M52 148H442M245 43v115"/></g>
  <path d="M55 40v119M55 118h384" stroke="#607088"/>
  <g fill="#425269" text-anchor="end"><text x="48" y="52">+7</text><text x="48" y="122">0</text><text x="48" y="152">−3</text></g>
  <path d="M55 148h190l190-100" stroke="#264cc4" stroke-width="3.5"/>
  <path d="m55 48 190 100h190" stroke="#9c481c" stroke-width="3.5" stroke-dasharray="8 4"/>
  <circle cx="302" cy="118" r="4.5" fill="#264cc4"/><circle cx="188" cy="118" r="4.5" fill="#9c481c"/>
  <g fill="#425269" text-anchor="middle"><text x="55" y="175">40</text><text x="188" y="175">47</text><text x="245" y="175">50</text><text x="302" y="175">53</text><text x="435" y="175">60</text><text x="245" y="198">Cours de l’action à l’échéance (€)</text></g>
  <path d="M250 20h22" stroke="#264cc4" stroke-width="3"/><path d="M350 20h22" stroke="#9c481c" stroke-width="3" stroke-dasharray="5 2"/>
  <g fill="#334155"><text x="277" y="24">Call acheté</text><text x="377" y="24">Put acheté</text></g>
</svg>
